inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  dev:
    url: github:hatimthayyil/dev
    flake: false
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
  - dev/envs/rust
