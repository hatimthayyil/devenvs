inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  devenvs:
    url: github:hatimthayyil/devenvs
    flake: false
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
  - devenvs/rust
